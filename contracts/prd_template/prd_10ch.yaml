# PRD 10 章模板（唯一权威源）
# =========================================================================
# 解决原 contracts.md §14.2（10 章）和 §16（10 章）重复且冲突的问题
# 此处为唯一权威源
# =========================================================================

_version: "2.0.0"
_description: "supervisor合并 final_prd.md 时严格按此结构。reviewer审核 PRD 格式时按此校验。"

# -----------------------------------------------------------------------------
# 10 章结构
# -----------------------------------------------------------------------------
chapters:

  # ===========================================================================
  # 第 0 章：截图与标注索引（PRD 核心）
  # ===========================================================================
  - num: 0
    name: 截图与标注索引
    required: true
    required_for_scale: [standard, complex]
    subsections:
      - "0.1 页面截图索引"
      - "0.2 标注索引表（annotation.md 摘要）"
    note: "PRD 核心，截图+标注编号+补充说明三件套"
    source: workflow/_archive/contracts.v1.md#l227-280
    template: |
      ## 0. 截图与标注索引

      ### 0.1 页面截图索引

      | 截图文件 | 对应页面 | 标注编号范围 | 优先级 |
      |---|---|---|---|
      | `screenshots/01_fund_search.png` | 基金搜索页 | ①~⑧ | P0 |
      | ... | ... | ... | ... |

      ### 0.2 标注索引表（annotation.md 摘要）

      | 编号 | 页面 | 界面元素 | 交互规则 | 数据源 | 边界条件 | 样式状态 |
      |---|---|---|---|---|---|---|
      | ① | 基金搜索 | 搜索输入框 | 输入≥2字符弹出候选列表，≤500ms | GET /api/v1/funds/search?q= | 空输入不触发；特殊字符过滤 | 加载中：骨架屏；无结果："未找到" |
      | ... | ... | ... | ... | ... | ... | ... |

  # ===========================================================================
  # 第 1 章：执行摘要
  # ===========================================================================
  - num: 1
    name: 执行摘要
    required: true
    word_limit: 200
    source: workflow/_archive/contracts.v1.md#l283-286
    template: |
      ## 1. 执行摘要（Executive Summary）
      - 一段话说清：为谁、解决什么、方案是什么、预期影响
      - 字数控制：200 字以内

  # ===========================================================================
  # 第 2 章：问题陈述
  # ===========================================================================
  - num: 2
    name: 问题陈述
    required: true
    must_contain: ["谁遇到", "为什么痛", "为什么现在解决", "不解决的代价"]
    source: workflow/_archive/contracts.v1.md#l288-290
    template: |
      ## 2. 问题陈述（Problem Statement）
      - 谁遇到了什么问题
      - 为什么痛
      - 为什么现在解决
      - 不解决的代价

  # ===========================================================================
  # 第 3 章：方案概述
  # ===========================================================================
  - num: 3
    name: 方案概述
    required: true
    must_contain: ["高层描述", "核心流程", "系统简图(mermaid)", "版本里程碑"]
    source: workflow/_archive/contracts.v1.md#l292-293
    template: |
      ## 3. 方案概述（Solution Overview）
      - 高层描述
      - 核心流程
      - 系统简图（mermaid）
      - 版本里程碑

  # ===========================================================================
  # 第 4 章：目标用户与场景（v6.0 P2-3 加 user story）
  # ===========================================================================
  - num: 4
    name: 目标用户与场景
    required: true
    must_contain: ["主要画像", "次要画像", "典型使用场景", "用户旅程关键触点", "user story"]
    source: workflow/_archive/contracts.v1.md#l295-297
    template: |
      ## 4. 目标用户与场景（Target Users & Scenarios）
      - 主要画像
      - 次要画像
      - 典型使用场景
      - 用户旅程关键触点

      ### 4.x User Story（v6.0：5-8 条，与典型场景一一对应）

      > 格式：**作为** <角色>，**我要** <行为>，**以便** <价值>。
      > 每条 story 必须挂到一个典型场景（S#），并能在第 5 章找到对应 AC 编号。

      - **US-01**（对应 S1）作为 C 端咨询者，我要 输入问题后 3 秒内拿到带引用的答案，以便 不用等人工客服
      - **US-02**（对应 S5）作为 知识库运营，我要 未命中问题自动归集，以便 快速补齐知识盲区

  # ===========================================================================
  # 第 5 章：验收标准（v4.0 起用 EARS 格式）
  # ===========================================================================
  - num: 5
    name: 验收标准
    required: true
    must_be: "EARS 格式（When/The system shall），每条二元可判定"
    source: workflow/_archive/contracts.v1.md#l299-300
    template: |
      ## 5. 验收标准（Acceptance Criteria · EARS）

      > EARS 句式：**当 [触发条件/事件]，系统应 [可观察的行为]**（WHEN...THE SYSTEM SHALL）
      > 每条必须二元可判定（通过/不通过），不允许"体验良好"类主观表述。

      ### 5.1 正常流程
      - **AC-01** 当 [用户提交有效表单]，系统应 [在 1 秒内返回成功提示并刷新列表]
      - **AC-02** 当 [数据加载完成]，系统应 [显示数据更新时间]

      ### 5.2 异常与边界
      - **AC-03** 当 [网络不可用]，系统应 [展示离线兜底数据并标注"数据更新于 HH:MM"]
      - **AC-04** 当 [输入为空]，系统应 [禁用提交按钮并显示占位提示]
      - **AC-05** 当 [外部数据源超时 > 3s]，系统应 [按降级链切换备用源]

  # ===========================================================================
  # 第 6 章：非功能需求
  # ===========================================================================
  - num: 6
    name: 非功能需求
    required: true
    categories: [性能, 安全, 可用性, 合规]
    source: workflow/_archive/contracts.v1.md#l302-303
    template: |
      ## 6. 非功能需求（NFR）
      - 性能
      - 安全
      - 可用性
      - 合规

  # ===========================================================================
  # 第 7 章：成功指标
  # ===========================================================================
  - num: 7
    name: 成功指标
    required: true
    must_contain: ["北极星指标", "过程指标", "当前值->目标值"]
    source: workflow/_archive/contracts.v1.md#l305-306
    template: |
      ## 7. 成功指标（Goals & Success Metrics）
      - 北极星指标
      - 过程指标
      - 当前值 → 目标值

  # ===========================================================================
  # 第 8 章：依赖与风险
  # ===========================================================================
  - num: 8
    name: 依赖与风险
    required: true
    must_contain: ["技术依赖", "外部依赖", "风险", "应对策略"]
    source: workflow/_archive/contracts.v1.md#l308-309
    template: |
      ## 8. 依赖与风险（Dependencies & Risks）
      - 技术依赖
      - 外部依赖
      - 风险
      - 应对策略

      ### 8.1 数据结构（v6.0 P2-2，学 MetaGPT）

      > 核心实体 ≥ 1 个 JSON 示例；研发不再自由发挥字段命名。

      ```json
      {
        "id": "ticket_20260913_001",
        "user_session": "anon_8f3a",
        "question": "X100 电池容量",
        "answer_refs": ["chunk_0421"],
        "status": "open",
        "created_at": "2026-09-13T10:00:00+08:00"
      }
      ```

      ### 8.2 API 契约示例（关键接口 ≥ 1 个）

      ```
      POST /api/ask
      Request:  { "session_id": "anon_8f3a", "query": "X100 电池容量" }
      Response: { "answer": "...", "refs": [...], "latency_ms": 1200, "data_as_of": "2026-09-13" }
      ```

      ### 8.3 错误码字典

      | 错误码 | 场景 | 用户看到什么 |
      |---|---|---|
      | E_TIMEOUT | LLM 超时 >4s | "回答超时，请重试"，自动转降级链 |
      | E_NO_ANSWER | 知识库无答案 | 兜底 UI + 相关问题推荐 + 工单按钮 |

  # ===========================================================================
  # 第 9 章：开放问题
  # ===========================================================================
  - num: 9
    name: 开放问题
    required: true
    must_contain: ["未决策事项", "待确认项", "责任人", "决策截止时间"]
    source: workflow/_archive/contracts.v1.md#l311-312
    template: |
      ## 9. 开放问题（Open Issues）
      | 未决策事项 | 待确认项 | 责任人 | 决策截止时间 |
      |---|---|---|---|
      | ... | ... | ... | ... |

  # ===========================================================================
  # 第 10 章：附录
  # ===========================================================================
  - num: 10
    name: 附录
    required: true
    must_contain: ["技术架构", "合规清单", "原始 Agent 产出索引", "TDL 技术决策日志", "API 契约定义"]
    source: workflow/_archive/contracts.v1.md#l314-318
    template: |
      ## 10. 附录（Appendix）
      - 技术架构（来自原型）
      - 合规清单（来自合规）
      - 原始 Agent 产出索引
      - TDL 技术决策日志
      - API 契约定义

# -----------------------------------------------------------------------------
# 截图规范（5.1）
# -----------------------------------------------------------------------------
screenshot_spec:
  format: png
  resolution: "1280x900"
  annotation_style:
    color: "红色"
    shape: "圆圈"
    font: "14px 加粗"
  naming: "{序号}_{页面英文名}.png"
  examples:
    - "01_fund_search.png"
    - "02_fund_detail.png"
    - "03_watchlist.png"
  source: workflow/_archive/contracts.v1.md#l322-326

# -----------------------------------------------------------------------------
# 标注索引表规范（5.2）
# -----------------------------------------------------------------------------
annotation_spec:
  fields:
    - { name: 编号, type: string, note: "①~㊿，全局唯一" }
    - { name: 页面, type: string }
    - { name: 界面元素, type: string, note: "搜索框/按钮/表格行/弹窗" }
    - { name: 交互规则, type: text, note: "点击/输入/滑动等操作行为" }
    - { name: 数据源, type: text, note: "API 端点 + 入参 + 出参" }
    - { name: 边界条件, type: text, note: "空/错/极值/离线等异常情况" }
    - { name: 样式状态, type: text, note: "空态/加载态/正常态/异常态" }
    - { name: 字段清单, type: table, note: "字段数据来源 + 展示格式" }
  lock_after: "原型评审门通过"
  unlock_procedure: |
    编号锁定后原则上不允许变更。
    例外：若 PM 主动说"改需求：XXX"，标 SCOPE_CHANGE 后走：
    1. supervisor解除锁定
    2. 原型-A3 重新出截图 + 标注
    3. reviewer重审 + 重新锁定
  source: workflow/_archive/contracts.v1.md#l332-344

# -----------------------------------------------------------------------------
# 功能清单（FR List）—— 附录 10 章内
# -----------------------------------------------------------------------------
fr_list_spec:
  location: "第 10 章 附录内"
  format: |
    | FR 编号 | 名称 | 优先级 | 描述 | 验收条件 |
    |---|---|---|---|---|
    | FR-01 | 新建报销单 | P0 | 选类型+填金额+传发票+选审批人 | AC-01 / AC-03 |
    | ... | ... | ... | ... | ... |
  note: "FR/NFR 全在一张表，仅作索引，不展开（展开在标注索引中）；验收条件列引用第 5 章 EARS 编号（AC-NN）"
  source: workflow/_archive/contracts.v1.md#l345-347

# -----------------------------------------------------------------------------
# 校验提示
# -----------------------------------------------------------------------------
validation:
  rule_id: prd_format
  description: "PRD 10 章结构校验"
  applies_to: [shangshu]
  severity: P0
  check: |
    校验器读此文件，遍历 chapters 列表：
    - 每个 chapter 必须存在对应 `## {num}. {name}` 章节
    - 缺失任一章节 → P0 fail
    - 第 0 章 required_for_scale 不含 light 时跳过

# -----------------------------------------------------------------------------
# 与原 contracts.md §16 的差异（已修复）
# -----------------------------------------------------------------------------
diff_from_v1_section16:
  description: |
    原 contracts.md §16（重复的 7-10 章）与 §14.2 章节号冲突、内容重叠。
    v2.0 修复：
  fixes:
    - "§16 第 7 章 '范围与里程碑' → 删除（与第 3 章里程碑重复）"
    - "§16 第 7 章 '成功指标' → 与 §14.2 第 7 章冲突 → 统一为 '成功指标'"
    - "§16 第 8 章 '依赖与风险' → 与 §14.2 第 8 章重复 → 保留 §14.2 版本"
    - "§16 第 9 章 '开放问题' → 与 §14.2 第 9 章重复 → 保留 §14.2 版本"
    - "§16 第 10 章 '附录' → 与 §14.2 第 10 章重复 → 保留 §14.2 版本"
  archived_section: workflow/_archive/contracts.v1.md#l347-363