# 各 Agent 契约（输入/输出/必填/可选）—— 机器可读
# =========================================================================
# 取代原 contracts.md §5-§12 的 8 个 Agent 契约段
# =========================================================================

_version: "2.0.0"

agents:

  # ===========================================================================
  # 用户研究（libu / user_research）
  # ===========================================================================
  - id: libu
    name_cn: 用户研究
    name_en: user_research
    input:
      required:
        - source: PM
          type: text
          note: "PM 原始需求文本"
      optional:
        - source: knowledge_graph
          type: kg_query
          note: "同 scale 历史 Persona/Scenario（v2.0 推荐）"
    output:
      file: "归档需求产出/${req_id}/01_drafted/01_user_research.md"
      required_sections:
        - name: 用户画像
          schema_ref: knowledge_graph/legacy/${req_id}/personas.yaml
          min_count_by_scale:
            light: 1
            standard: 2
            complex: 3
        - name: 典型场景
          schema_ref: knowledge_graph/legacy/${req_id}/scenarios.yaml
          min_count_by_scale:
            light: 1
            standard: 2
            complex: 3
        - name: 关键洞察
          min_items: 3
          each_must_have: [importance, counter_example]
      kg_refs_field:
        location: "## 知识图谱引用"
        required: true
        required_for_scale: [standard, complex]
        schema:
          - entity_id: string
            role: enum[template, reference, counter_example]
            note: string
    guardrail_refs: [g001, g002, g003, g004, g005, g006, g007, g014, g101]
    source: workflow/_archive/contracts.v1.md#l109-117

  # ===========================================================================
  # 战略（bingbu / strategy_risk）
  # ===========================================================================
  - id: bingbu
    name_cn: 战略
    name_en: strategy_risk
    input:
      required:
        - source: libu
          file: "归档需求产出/${req_id}/01_drafted/01_user_research.md"
        - source: PM
          type: text
      optional:
        - source: knowledge_graph
          type: kg_query
          note: "历史 FR / StateMachine 模板"
    output:
      files:
        - path: "归档需求产出/${req_id}/01_drafted/02_strategy_and_risk.md"
          required_sections: [功能清单, 业务流程, 竞品对比, 风险清单, 状态机概要]
        - path: "归档需求产出/${req_id}/01_drafted/02_state_machine.md"
          required_sections: [mermaid_block]
          optional_by_scale:
            light: true
      required_sections_in_main:
        - name: FR
          min_count: 5
          priority_required_by_scale:
            standard: true
            complex: true
        - name: 风险
          must_have_levels: [P0, P1, P2]
      kg_refs_field:
        location: "## 知识图谱引用"
        required: true
        required_for_scale: [standard, complex]
    guardrail_refs: [g001, g002, g003, g004, g005, g006, g007, g008, g009, g010, g011, g012, g013, g014, g102]
    source: workflow/_archive/contracts.v1.md#l118-123

  # ===========================================================================
  # 指标（hubu / metrics_value）
  # ===========================================================================
  - id: hubu
    name_cn: 指标
    name_en: metrics_value
    input:
      required:
        - source: bingbu
          file: "归档需求产出/${req_id}/01_drafted/02_strategy_and_risk.md"
      optional:
        - source: libu
          file: "归档需求产出/${req_id}/01_drafted/01_user_research.md"
        - source: knowledge_graph
          type: kg_query
          note: "历史 Metric 模板"
    output:
      file: "归档需求产出/${req_id}/01_drafted/03_metrics_and_value.md"
      required_sections:
        - name: 北极星指标
          exactly: 1
          each_must_have: [定义, 公式, 数据来源, 目标值]
        - name: 过程指标
          max_items: 5
        - name: 验收标准
          coverage: "每个 FR/NFR 对应一条可二元判断的条件"
        - name: 价值评估
          must_contain: [ROI估算或定性价值, 机会成本, 反例]
      kg_refs_field:
        location: "## 知识图谱引用"
        required: true
        required_for_scale: [standard, complex]
    guardrail_refs: [g001-g014, g103]
    source: workflow/_archive/contracts.v1.md#l124-131

  # ===========================================================================
  # 合规（libu_compliance / compliance）
  # ===========================================================================
  - id: libu_compliance
    name_cn: 合规
    name_en: compliance
    input:
      required:
        - source: bingbu
          file: "归档需求产出/${req_id}/01_drafted/02_strategy_and_risk.md"
        - source: hubu
          file: "归档需求产出/${req_id}/01_drafted/03_metrics_and_value.md"
        - source: libu
          file: "归档需求产出/${req_id}/01_drafted/01_user_research.md"
      optional:
        - source: knowledge_graph
          type: kg_query
          note: "合规规则库（按 industry）"
    output:
      file: "归档需求产出/${req_id}/01_drafted/04_compliance.md"
      required_sections:
        - name: 数据隐私评估
          required_when: "涉及 PII"
        - name: 行业合规
          categories:
            - 金融
            - 医疗
            - 教育
            - 跨境
            - 通用
        - name: 伦理审查
          required_when: "涉及未成年人/弱势群体"
        - name: 品牌一致性
      decision_required: true
      legal_decision_values: [PASS, NEEDS_REVIEW, BLOCK]
      kg_refs_field:
        location: "## 知识图谱引用"
        required: true
        required_for_scale: [standard, complex]
    guardrail_refs: [g001-g014, g104]
    source: workflow/_archive/contracts.v1.md#l132-141

  # ===========================================================================
  # 原型（gongbu / engineering）—— 多角色
  # ===========================================================================
  - id: gongbu
    name_cn: 原型
    name_en: engineering
    roles: [A1_solution, A2_prototype, A3_screenshot, B_dev]
    input:
      A1_solution:
        required:
          - source: 上游全部 01_drafted
            pattern: "归档需求产出/${req_id}/01_drafted/0[1-4]_*.md"
        optional:
          - source: knowledge_graph
            type: kg_query
            note: "技术组件库（按 category）"
      A2_prototype:
        required:
          - source: final_prd
            file: "归档需求产出/${req_id}/03_finalized/final_prd.md"
          - source: A1
            file: "归档需求产出/${req_id}/01_drafted/05_solution.md"
      A3_screenshot:
        required:
          - source: A2
            dir: "归档需求产出/${req_id}/01_drafted/prototype/"
          - source: final_prd
            file: "归档需求产出/${req_id}/03_finalized/final_prd.md"
      B_dev:
        required:
          - source: final_prd
            file: "归档需求产出/${req_id}/03_finalized/final_prd.md"
          - source: A2
            dir: "归档需求产出/${req_id}/01_drafted/prototype/"
    output:
      A1_solution:
        file: "归档需求产出/${req_id}/01_drafted/05_solution.md"
        required_sections:
          - name: 技术选型
            license_required: true    # g105
          - name: 数据模型
            format: ["ER图", "表结构"]
          - name: API列表
            each_must_have: [端点, 入参, 出参, 错误码, 降级策略, 超时, 缓存]
          - name: 关键依赖
            license_required: true
          - name: 技术风险
          - name: TDL
            min_items_by_scale:
              standard: 3
              complex: 5
        coverage_rule:
          description: "原型中每个交互元素必须在 final_prd.md 中有对应"
        kg_refs_field:
          location: "## 知识图谱引用"
          required: true
          required_for_scale: [standard, complex]
      A2_prototype:
        dir: "归档需求产出/${req_id}/01_drafted/prototype/"
        required_files: [index.html, DESIGN.md, EXPERIENCE.md]  # v6.0 P3-2 产出二分
        per_p0_feature_html: true
        fidelity: low
        design_tokens: "contracts/design_tokens.yaml"  # v6.0 P3-1：色值必须引用 token（g015）
      A3_screenshot:
        dir: "归档需求产出/${req_id}/01_drafted/screenshots/"
        each: { format: png, resolution: "1280x900" }
        annotation_file: "归档需求产出/${req_id}/01_drafted/annotation.md"
      B_dev:
        dir: "归档需求产出/${req_id}/03_finalized/implementation/code/"
        must_have: [README.md, 可运行代码]
    guardrail_refs: [g001-g014, g105, g106, g015]
    source: workflow/_archive/contracts.v1.md#l142-152

  # ===========================================================================
  # 审计（xingbu / audit_logic）—— 多角色
  # ===========================================================================
  - id: xingbu
    name_cn: 审计
    name_en: audit_logic
    roles: [A_logic_audit, B_testing]
    input:
      A_logic_audit:
        required:
          - source: 上游全部
            pattern: "归档需求产出/${req_id}/01_drafted/0[1-5]_*.md"
        optional:
          - source: knowledge_graph
            type: kg_query
            note: "历史 Lesson（已知缺陷模式）"
      B_testing:
        required:
          - source: final_prd
            file: "归档需求产出/${req_id}/03_finalized/final_prd.md"
          - source: B_dev_code
            dir: "归档需求产出/${req_id}/03_finalized/implementation/code/"
    output:
      A_logic_audit:
        file: "归档需求产出/${req_id}/01_drafted/06_audit_report.md"
        required_sections: [内部一致性, 功能与指标对应, 流程闭环, 角色权限, 边界情况]
      B_testing:
        file: "归档需求产出/${req_id}/03_finalized/implementation/test_report.md"
        required_sections: [测试用例清单, 执行结果, 缺陷清单, 回归建议]
        defect_required: [复现步骤, 严重程度]
    guardrail_refs: [g001-g013, g107]
    source: workflow/_archive/contracts.v1.md#l153-165

  # ===========================================================================
  # reviewer（menxia / critic）
  # ===========================================================================
  - id: menxia
    name_cn: reviewer
    name_en: critic
    input:
      required:
        - source: validate_contract
          script: "scripts/validate_contract.py --req ${req_id} --agent all"
        - source: final_prd
          file: "归档需求产出/${req_id}/03_finalized/prd.md"
        - source: guardrails
          file: "contracts/schema/guardrails.yaml"
      optional:
        - source: 01_drafted
          pattern: "归档需求产出/${req_id}/01_drafted/0[1-6]_*.md"
          note: "深度验证"
    output:
      file: "归档需求产出/${req_id}/02_reviewed/review.md"
      required_sections:
        - name: 总体评价
        - name: 自动校验结果
          note: "validate_contract.py 输出原样贴入"
        - name: verdict
          values: [pass, fail]
        - name: 必须修改
          severity: P0
        - name: 建议优化
          severity: P1
        - name: 锦上添花
          severity: P2
      each_issue_must_have: [严重程度, 文件, 问题, 建议, 反例]
      dimensions: [完整性, 一致性, 可行性, 可测量]
    guardrail_refs: [g001-g013, g108]
    source: workflow/_archive/contracts.v1.md#l166-177

  # ===========================================================================
  # supervisor（shangshu / dispatcher）
  # ===========================================================================
  - id: shangshu
    name_cn: supervisor
    name_en: dispatcher
    input:
      required:
        - source: state_json
          file: "state.json"
        - source: contracts
          file: "contracts/README.md"
        - source: 归档需求产出
          pattern: "归档需求产出/${req_id}/01_drafted/0[1-3]_*/"
      optional:
        - source: feedback_log
          dir: "feedback_log/shangshu/"
    output:
      files:
        - path: "归档需求产出/${req_id}/01_drafted/INDEX.md"
        - path: "归档需求产出/${req_id}/03_finalized/final_prd.md"
        - path: "归档需求产出/${req_id}/03_finalized/SUMMARY.md"
        - path: "归档需求产出/${req_id}/01_drafted/delivered.md"
    guardrail_refs: [g001-g013]
    note: "supervisor不写业务内容（隐含约束：只编排，不生产）"
    source: workflow/_archive/contracts.v1.md#l178-188

# -----------------------------------------------------------------------------
# supervisor合并 final_prd.md 的权限（v2.0 新增，解决原模糊地带）
# -----------------------------------------------------------------------------
shangshu_merge_authority:
  description: |
    supervisor合并 final_prd.md 时如果发现矛盾，应该怎么处理？
    原 contracts.md 未明确，v2.0 明确如下：
  rules:
    - "冲突类型 1：两个 Agent 产出对同一概念命名不同 → supervisor统一为最常用的命名，并在 SUMMARY.md 记录"
    - "冲突类型 2：战略 FR 与指标指标不对应 → supervisor打回对应 Agent，不擅自修改"
    - "冲突类型 3：合规合规结论与战略功能冲突 → supervisor打回对应 Agent（合规最优先）"
    - "冲突类型 4：Specialists产出与 PM 原始需求明显偏离 → supervisor打回对应 Agent"
  can_modify: false
  can_mark: true
  mark_format: "[待澄清 - 由 ${agent} 修订]"