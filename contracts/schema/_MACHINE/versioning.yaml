# 契约版本管理规范
# =========================================================================
# 此文件定义 contracts/ 目录的版本号、变更日志、文件命名约定
# =========================================================================

_version: "2.0.0"
_last_updated: 2026-07-03
_owner: supervisor

# -----------------------------------------------------------------------------
# 版本号策略（Semantic Versioning）
# -----------------------------------------------------------------------------
semver_policy: |
  MAJOR (X.0.0): 破坏性变化
    - Guardrail 编号重排或语义修改
    - 必备字段新增（导致历史 REQ 不通过校验）
    - Agent 契约重命名

  MINOR (x.Y.0): 向后兼容的新增
    - 新增 Guardrail（仅追加，不修改已有）
    - 新增 Agent 或角色
    - 新增 PRD 章节（可选章节）
    - 新增实体类型（知识图谱）

  PATCH (x.y.Z): 文档/示例调整
    - 文案润色、错别字修正
    - 示例补充
    - 注释完善

# -----------------------------------------------------------------------------
