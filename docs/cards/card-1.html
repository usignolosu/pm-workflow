<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#F5F6FA;--card:#FFF;--line:#E5E7EB;--t1:#111827;--t2:#6B7280;--t3:#9CA3AF;--pri:#2563EB;--pri-h:#3B82F6;--pri-bg:#EFF6FF;--ok:#22C55E;--ok-bg:#F0FDF4;--warn:#F59E0B;--warn-bg:#FFFBEB;--danger:#EF4444;--danger-bg:#FEF2F2;--purple:#8B5CF6;--pink:#EC4899;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-pill:9999px}
html,body{background:#E5E7EB;color:var(--t1);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{padding:0;margin:0;display:flex;justify-content:center;align-items:flex-start}
.deck{display:flex;flex-direction:column;align-items:center;gap:0;padding:0}
.card{width:750px !important;height:auto !important;min-height:0 !important;max-height:none !important;overflow:visible !important;background:var(--card);border-radius:var(--r-lg);box-shadow:0 10px 30px rgba(0,0,0,.08);padding:36px 40px;display:flex;flex-direction:column;margin:24px auto;position:relative}
.num{position:absolute;top:20px;right:24px;font-size:11px;color:var(--t3);font-weight:600;letter-spacing:1px}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.brand .logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#2563EB,#8B5CF6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.brand .name{font-size:13px;font-weight:600}
.brand .tag{font-size:10px;background:#F3F4F6;color:var(--t2);padding:2px 7px;border-radius:var(--r-pill)}
.title{margin-bottom:8px}
.title h1{font-size:32px;font-weight:700;line-height:1.2;letter-spacing:-.5px;margin-bottom:6px}
.title h1 .em{color:var(--pri)}
.title p{font-size:13px;color:var(--t2);line-height:1.6}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);margin-right:4px;margin-top:6px}
.b-pri{background:var(--pri-bg);color:var(--pri)}
.b-warn{background:var(--warn-bg);color:#92400E}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-purple{background:#EDE9FE;color:#5B21B6}
.badge{display:inline-block;background:#F3F4F6;color:var(--t2);font-size:10px;font-weight:600;padding:2px 8px;border-radius:var(--r-pill);margin-left:6px}
.feature{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.feature:last-child{border-bottom:0}
.feature .icon{width:38px;height:38px;border-radius:var(--r-sm);background:var(--pri-bg);color:var(--pri);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.feature .info{flex:1;min-width:0}
.feature .name{font-size:14px;font-weight:600;margin-bottom:2px;display:flex;align-items:center}
.feature .desc{font-size:12px;color:var(--t2);line-height:1.55}
.callout{background:linear-gradient(135deg,#EFF6FF,#EDE9FE);border-radius:var(--r-md);padding:14px 18px;margin:10px 0;font-size:13px;line-height:1.6}
.kpi{display:flex;gap:10px;margin-top:8px}
.kpi .item{flex:1;background:#F9FAFB;border-radius:var(--r-sm);padding:10px;text-align:center;border:1px solid var(--line)}
.kpi .v{font-size:20px;font-weight:700;color:var(--pri);font-family:ui-monospace,Menlo,monospace}
.kpi .l{font-size:10px;color:var(--t2);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:left;vertical-align:top}
th{color:var(--t2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tr:last-child td{border-bottom:0}
.role{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.role:last-child{border-bottom:0}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:16px;flex-shrink:0}
.role .info{flex:1;min-width:0}
.role .name{font-size:15px;font-weight:600;margin-bottom:1px}
.role .what{font-size:12px;color:var(--t2);margin-bottom:3px}
.role .when{font-size:10px;color:var(--t3);font-family:ui-monospace,Menlo,monospace}
.line{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.line:last-child{border-bottom:0}
.line .k{font-family:ui-monospace,Menlo,monospace;color:var(--pri);font-weight:600;flex-shrink:0;margin-right:10px;min-width:90px}
.line .v{color:var(--t2);flex:1}
.cmd{display:flex;justify-content:space-between;align-items:center;background:#F9FAFB;border-radius:var(--r-sm);padding:8px 12px;margin-bottom:6px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.cmd .l{flex:1}
.cmd .d{font-size:10px;color:var(--t2);font-family:-apple-system,sans-serif;flex-shrink:0;margin-left:8px}
.matrix{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.matrix th,.matrix td{border:1px solid var(--line);padding:5px 4px;text-align:center;vertical-align:middle}
.mth{background:#F3F4F6;font-size:10px;font-weight:600}
.matrix td.r{text-align:left;font-weight:600;background:#F9FAFB}
.on{background:#EFF6FF;color:#1E40AF;font-weight:600}
.g{background:#FFFBEB;color:#92400E;font-weight:600}
.off{color:#D1D5DB}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}
.box{background:#F9FAFB;border-radius:var(--r-md);padding:14px;border:1px solid var(--line)}
.box h3{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.box p{font-size:12px;color:var(--t2);line-height:1.6}
.flow{display:flex;align-items:stretch;gap:6px;flex-wrap:nowrap;margin:14px 0}
.flow .step{flex:1;background:#F9FAFB;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 6px;text-align:center;font-size:11px;color:var(--t2);min-height:60px;display:flex;flex-direction:column;justify-content:center}
.flow .step b{color:var(--pri);font-size:12px;margin-bottom:3px;display:block}
.flow .arr{color:var(--t3);font-size:14px;flex:0 0 auto;align-self:center}
.flow .gate{background:var(--warn-bg);border-color:var(--warn)}
.flow .gate b{color:#92400E}
.flow .auto{background:var(--pri-bg);border-color:var(--pri)}
.flow .auto b{color:var(--pri)}
.flow .done{background:var(--ok-bg);border-color:var(--ok)}
.flow .done b{color:var(--ok)}
.footer{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.footer .credit{font-size:10px;color:var(--t3)}
.footer .next{font-size:11px;color:var(--pri);font-weight:600}
h1.card-h{font-size:24px;font-weight:700;margin:14px 0 4px;line-height:1.25}
</style>
</head>
<body>
<div class="deck">
<div class="card" id="card-1">
  <div class="num">01 / 08</div>
  <div class="brand">
    <div class="logo">工</div>
    <div class="name">产品自动化工作流</div>
    <span class="tag">v7.0.0</span>
  </div>
  <div class="title" style="margin-top:auto">
    <h1>把 PRD 流水线<br>交给一支<br><span class="em">AI 专家组</span>来跑</h1>
    <p>主编排 + 13 角色 + QA 终审<br>需求一句话，全套产出</p>
  </div>
  <div class="kpi">
    <div class="item"><div class="v">13+3</div><div class="l">常驻 + 扩展角色</div></div>
    <div class="item"><div class="v">4+机</div><div class="l">人工门 + 机器门</div></div>
    <div class="item"><div class="v">20</div><div class="l">Guardrail 防线</div></div>
  </div>
  <div class="footer">
    <span class="credit">v7.0.0 · 合并定稿 · 与 WorkBuddy 项目级 Skill 同源</span>
    <span class="next">→ 一分钟看完 8 张</span>
  </div>
</div>
</div>
</body>
</html>
