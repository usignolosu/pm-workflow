- _type: Lesson
  id: lesson.001
  title: "数据时间戳缺失"
  severity: MED
  description: |
    原型和数据 API 返回数据时没有显示数据的截止时间（如'数据更新于 12:00'）。
    用户不知道数据的时效性，容易做出错误判断。
  actual_consequence: "开发中需要额外加'数据更新时间'字段、修改 API 返回结构、前端展示。"
  remediation: "PRD 功能说明模板增加'数据时间戳'必填子节"
  linked_guardrails: ["g010"]
  derived_from: 示例REQ-B
  source: "workflow/lessons.md#L7"
  created: 2026-07-03
  status: legacy

- _type: Lesson
  id: lesson.002
  title: "数据降级链路不完整，离线场景未定义"
  severity: HIGH
  description: |
    设计文档写了'主数据源 不可用时降级到备用数据源'，但没写：
    - 备用数据源也不可用怎么办？
    - 完全无网络时用内置演示数据还是展示'暂无数据'？
    - 每级降级对用户的影响是什么？
  actual_consequence: "开发中需要补 第三方数据源适配器 + 复合数据源 + 离线新闻样本库"
  remediation: "PRD 功能说明模板增加'数据降级链路'必填子节，明确 3 级降级 + 每级用户影响"
  linked_guardrails: ["g011"]
  derived_from: 示例REQ-B
  source: "workflow/lessons.md#L18"
  created: 2026-07-03
  status: legacy
  notes: "Guardrail g011 即由此教训沉淀而成"

- _type: Lesson
  id: lesson.003
  title: "算法边界条件未定义"
  severity: HIGH
  description: |
    计算引擎的定投每周偏移(day%5 → (day-1)%5)、统计模块 缺 max_return_value 字段、
    定投模块 缺 lump_sum_date_field 字段，都暴露了设计文档没有覆盖算法边界条件
  actual_consequence: "多次修复 + 1 次'HIGH bug'修复"
  remediation: "PRD 功能说明模板增加'算法边界'子节，覆盖零输入/单值输入/整除边界/索引越界/时序靠后数据不完整"
  linked_guardrails: ["g012"]
  derived_from: 示例REQ-B
  source: "workflow/lessons.md#L32"
  created: 2026-07-03
  status: legacy

- _type: Lesson
  id: lesson.004
  title: "API 字段清单与原型展示字段不一致"
  severity: HIGH
  description: |
    原型中设计了'状态角标'、'分组 Tab'、'搜索补全'等交互元素，
    但 PRD 中没有对应的功能说明和验收条件。
    开发时原型和 API 的字段对不上，需要反复对齐
  actual_consequence: "1 次'原型对齐修复'commit，修改了 21 个文件"
  remediation: "新增 Guardrail #13'原型-实施对齐契约'。评审组在原型产出后必须做'原型-PRD对齐检查'"
  linked_guardrails: ["g013"]
  derived_from: 示例REQ-B
  source: "workflow/lessons.md#L43"
  created: 2026-07-03
  status: legacy

- _type: Lesson
  id: lesson.005
  title: "批量调用性能未定义"
  severity: MED
  description: |
    自选清单列表对每条记录串行拉取数据，页面加载极慢。
    设计文档没有定义'批量数据的拉取方式（并行/串行）'
  actual_consequence: "开发中改为 asyncio.gather + asyncio.to_thread 并行拉取，修复为'HIGH bug'"
  remediation: "TDL 新增'并行/串行策略'条目。评审组新增'并发性能检查'"
  linked_guardrails: []
  derived_from: 示例REQ-B
  source: "workflow/lessons.md#L54"
  created: 2026-07-03
  status: legacy

- _type: Lesson
  id: lesson.006
  title: "运行时版本兼容性未声明"
  severity: MED
  description: "设计文档假设 Python 3.11，但部署环境是 Python 3.9。`X | None`、`list[X]` 等语法不兼容"
  actual_consequence: "全局修改所有 Python 文件，补充 `from __future__ import annotations` + typing 导入"
  remediation: "TDL 新增'最低运行时版本（详细）'条目"
  linked_guardrails: []
  derived_from: 示例REQ-B
  source: "workflow/lessons.md#L64"
  created: 2026-07-03
  status: legacy

