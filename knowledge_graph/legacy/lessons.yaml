- _type: Lesson
  id: lesson.008
  title: "数据持久化方案模糊"
  severity: MED
  description: |
    本地缓存数据存 LocalStorage，但刷新后某些页面的自选清单、基金关注等数据丢失。
    设计文档对'什么数据刷新后保留，什么不保留'定义模糊
  actual_consequence: "开发中需要在多处加 localStorage 持久化和恢复逻辑"
  remediation: "PRD 功能说明模板加强'数据持久化'子节，明确刷新保留/清除条件"
  linked_guardrails: ["g009"]
  derived_from: 示例REQ-B
  source: "workflow/lessons.md#L87"
  created: 2026-07-03
  status: legacy

- _type: Lesson
  id: lesson.009
  title: "新闻情感评分的数据来源未定义降级"
  severity: LOW
  description: "情感评分依赖正负面词库匹配，但 主数据源 新闻源不可用时无降级。离线新闻 URL 包含星号错误"
  actual_consequence: "改为 fallback 优先策略：先用内置新闻样本，主数据源 实时新闻作为备选"
  remediation: "PRD 功能说明模板的'数据降级链路'子节强调新闻/搜索等非核心功能的降级策略"
  linked_guardrails: ["g011"]
  derived_from: 示例REQ-B
  source: "workflow/lessons.md#L98"
  created: 2026-07-03
  status: legacy