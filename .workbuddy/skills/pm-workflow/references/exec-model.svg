<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1060" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- background -->
  <rect width="700" height="1060" fill="#f7f8fa"/>

  <!-- title -->
  <text x="350" y="32" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">执行模型与可观测性（修正版 · v0.4）</text>
  <text x="350" y="54" font-size="12" fill="#6b7280" text-anchor="middle">复杂模式 ≠ 跳过阶段，而是在完整 8 阶段上"并行增强"</text>

  <!-- legend -->
  <rect x="30" y="66" width="14" height="14" rx="3" fill="#3b82f6"/>
  <text x="50" y="77" font-size="11" fill="#374151">全模式必走阶段</text>
  <rect x="180" y="66" width="14" height="14" rx="3" fill="#f59e0b"/>
  <text x="200" y="77" font-size="11" fill="#374151">确认门（HITL）</text>
  <rect x="320" y="66" width="14" height="14" rx="3" fill="#10b981"/>
  <text x="340" y="77" font-size="11" fill="#374151">复杂模式并行点</text>
  <rect x="480" y="66" width="14" height="14" rx="3" fill="#8b5cf6"/>
  <text x="500" y="77" font-size="11" fill="#374151">可观测性层</text>

  <!-- ===== central spine: 8 stages ===== -->
  <!-- ① -->
  <rect x="120" y="96" width="380" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="118" font-size="13" font-weight="600" fill="#1e3a8a">① 需求输入与澄清</text>
  <text x="140" y="137" font-size="10.5" fill="#374151">模式识别 + 苏格拉底式澄清（每次 1 问，背景→角色→场景→功能→边界）</text>

  <!-- ② -->
  <rect x="120" y="160" width="380" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="182" font-size="13" font-weight="600" fill="#1e3a8a">② 背景调研（轻量跳过）</text>
  <text x="140" y="201" font-size="10.5" fill="#374151">内部知识库检索：向量+关键词混合检索，复杂模式叠加图谱追溯</text>

  <!-- ③ -->
  <rect x="120" y="224" width="380" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="246" font-size="13" font-weight="600" fill="#1e3a8a">③ 行业调研 + 用例转写（轻量跳过）</text>
  <text x="140" y="265" font-size="10.5" fill="#374151">联网竞品/行业扫描 → 转写为标准用户用例</text>

  <!-- ④ -->
  <rect x="120" y="288" width="380" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="310" font-size="13" font-weight="600" fill="#1e3a8a">④ 场景梳理 → 用户故事地图 + 用户旅程图</text>
  <text x="140" y="329" font-size="10.5" fill="#374151">场景卡（角色/触发/流程/异常/边界）+ 两张图（搭建起点产出）</text>

  <!-- gate 1 -->
  <circle cx="310" cy="362" r="17" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="310" y="367" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">门1</text>

  <!-- ⑤ -->
  <rect x="120" y="392" width="380" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="414" font-size="13" font-weight="600" fill="#1e3a8a">⑤ 生成产品功能表（RICE 优先级）</text>
  <text x="140" y="433" font-size="10.5" fill="#374151">模块/功能点/RICE/依赖/边界（轻量用 P0/P1/P2）</text>

  <!-- gate 2 -->
  <circle cx="310" cy="465" r="17" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="310" y="470" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">门2</text>

  <!-- ⑥ -->
  <rect x="120" y="495" width="380" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="517" font-size="13" font-weight="600" fill="#1e3a8a">⑥ 生成低保真原型（线框 + 交互说明）</text>
  <text x="140" y="536" font-size="10.5" fill="#374151">页面结构 + 交互说明（Mermaid/HTML 线框）</text>

  <!-- gate 3 -->
  <circle cx="310" cy="568" r="17" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="310" y="573" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">门3</text>

  <!-- ⑦ -->
  <rect x="120" y="598" width="380" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="620" font-size="13" font-weight="600" fill="#1e3a8a">⑦ 并行产出：PRD ∥ 高保真原型 ∥ 测试用例</text>
  <text x="140" y="639" font-size="10.5" fill="#374151">14 模块 PRD（图文/流程图）+ React 可交互 + 用例同步</text>

  <!-- ⑧ -->
  <rect x="120" y="662" width="380" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="684" font-size="13" font-weight="600" fill="#1e3a8a">⑧ QA 评审 + 缺口分析 + 来源标注</text>
  <text x="140" y="703" font-size="10.5" fill="#374151">质量校验 → 交付物 + 待完善清单（强制标注信息来源）</text>

  <!-- vertical spine connector -->
  <line x1="310" y1="148" x2="310" y2="160" stroke="#9ca3af" stroke-width="2"/>
  <line x1="310" y1="212" x2="310" y2="224" stroke="#9ca3af" stroke-width="2"/>
  <line x1="310" y1="276" x2="310" y2="288" stroke="#9ca3af" stroke-width="2"/>
  <line x1="310" y1="340" x2="310" y2="392" stroke="#9ca3af" stroke-width="2"/>
  <line x1="310" y1="443" x2="310" y2="495" stroke="#9ca3af" stroke-width="2"/>
  <line x1="310" y1="547" x2="310" y2="598" stroke="#9ca3af" stroke-width="2"/>
  <line x1="310" y1="650" x2="310" y2="662" stroke="#9ca3af" stroke-width="2"/>

  <!-- ===== right side: complex-mode parallel annotations ===== -->
  <text x="540" y="180" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">复杂模式并行点</text>

  <!-- parallel cluster ②/③ -->
  <rect x="520" y="158" width="160" height="92" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="532" y="178" font-size="10.5" font-weight="600" fill="#065f46">调研并行（Agent 分身）</text>
  <text x="532" y="196" font-size="10" fill="#374151">调研员 ∥ 行业分析 ∥</text>
  <text x="532" y="212" font-size="10" fill="#374151">用例转写 同时跑</text>
  <text x="532" y="234" font-size="9.5" fill="#6b7280">→ 主流程汇总</text>

  <!-- parallel cluster ⑦ -->
  <rect x="520" y="592" width="160" height="92" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="532" y="612" font-size="10.5" font-weight="600" fill="#065f46">产出并行（Agent 分身）</text>
  <text x="532" y="630" font-size="10" fill="#374151">PRD ∥ 高保真 ∥</text>
  <text x="532" y="646" font-size="10" fill="#374151">测试用例 同时跑</text>
  <text x="532" y="668" font-size="9.5" fill="#6b7280">→ 主流程汇总</text>

  <!-- arrow from cluster to spine -->
  <line x1="520" y1="204" x2="500" y2="186" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="520" y1="638" x2="500" y2="624" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ===== bottom: observability layer ===== -->
  <rect x="120" y="742" width="560" height="280" rx="12" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="140" y="766" font-size="14" font-weight="700" fill="#5b21b6">可观测性（三层机制，全程贯穿）</text>

  <rect x="140" y="782" width="250" height="58" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1"/>
  <text x="156" y="804" font-size="12" font-weight="600" fill="#5b21b6">9.1 统一状态契约</text>
  <text x="156" y="823" font-size="10" fill="#374151">agent / state / doing / output / 来源 / 耗时</text>

  <rect x="408" y="782" width="252" height="58" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1"/>
  <text x="424" y="804" font-size="12" font-weight="600" fill="#5b21b6">9.2 任务看板（Task）</text>
  <text x="424" y="823" font-size="10" fill="#374151">9 角色任务 pending→in_progress→done</text>

  <rect x="140" y="852" width="250" height="58" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1"/>
  <text x="156" y="874" font-size="12" font-weight="600" fill="#5b21b6">9.3 定期进度汇报</text>
  <text x="156" y="893" font-size="10" fill="#374151">按阶段/定时汇总进展与下一步</text>

  <rect x="408" y="852" width="252" height="58" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1"/>
  <text x="424" y="874" font-size="12" font-weight="600" fill="#5b21b6">9.4 执行留痕</text>
  <text x="424" y="893" font-size="10" fill="#374151">runs/&lt;run-id&gt;/execution-log.md 可审计</text>

  <rect x="140" y="922" width="520" height="44" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="400" y="949" font-size="11" font-weight="600" fill="#5b21b6" text-anchor="middle">9.5 可视化状态大屏（可选 P4：show_widget 渲染 9 张 agent 卡片）</text>

  <!-- note -->
  <text x="350" y="1044" font-size="10.5" fill="#6b7280" text-anchor="middle">注：④ 场景 / ⑤ 功能 / ⑥ 低保真 三种模式都走且都过确认门；复杂模式额外拉上 架构师/SME 一起做，更严而非更少。</text>
</svg>
