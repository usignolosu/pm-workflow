# 苏格拉底 5 阶段澄清框架（v3.2 新增）
# =========================================================================
# 用于 enhanced_pm + complex 模式下的需求澄清门（替代平面 5 维度）。
# supervisor生成 prompt，PM 按阶段逐条回答，每阶段独立"够不够"判断。
# =========================================================================

_version: "1.0.0"
_last_updated: 2026-07-11
_owner: supervisor
_trigger: "mode=enhanced_pm AND scale=complex"
_legacy_equivalent: "workflow/clarification_questions.yaml（5 维度，standard 用）"

# -----------------------------------------------------------------------------
# 5 阶段总览
# -----------------------------------------------------------------------------
overview:
  purpose: |
    苏格拉底式追问：从"表面需求"递进到"可执行 PRD"。
    每阶段独立、递进、可跳过（PM 说"phase 跳过 3"）。
  duration: "15-30 分钟（PM 回答时间）"
  output_file: "deliverables/01_drafted/REQ-XXX/01_socratic_clarifications.md"
  template: "templates/socratic_5phases.md"

# -----------------------------------------------------------------------------
# 5 阶段定义
# -----------------------------------------------------------------------------
phases:

  # ===========================================================================
  # 阶段 1：情境追问（Circumstance）
  # ===========================================================================
  - id: p1_circumstance
    name: "情境追问"
    order: 1
    purpose: "搞清楚'谁在什么场景下做什么'"
    question_count: 3
    trigger_phrase: "我先问几个情境问题，帮我把场景说清楚"
    questions:
      - id: p1_q1
        text: "谁最痛？这个痛的人具体是谁（角色/画像/人数）？"
        why: "锁定用户。如果 PM 说不出来谁痛，多半需求是空想。"
        followup_if_vague:
          - "这个人有什么具体行为/数据？"
          - "他/她今天用什么 workaround？"
        example_good: "客服主管李姐，30-40 岁，管 5 个客服，每天接 200 通电话"
        example_bad: "用户（没说画像）/ 客户（模糊）"
        kg_impact: "用户研究画像'核心诉求'字段直接来自此答复"

      - id: p1_q2
        text: "痛到什么程度？如果不解决，3 个月后会怎样？6 个月后呢？"
        why: "判断真痛还是假痛。真痛有'不解决代价'，假痛只是 PM 个人偏好。"
        followup_if_vague:
          - "不解决的话，损失多少？"
          - "现在是用什么 workaround（凑合用）？"
        example_good: "3 个月后李姐团队会有人离职（重复问题消耗耐心），6 个月后客户流失率上升 20%"
        example_bad: "影响效率（没说具体）"
        kg_impact: "PRD 第 2 章'问题陈述'的'不解决代价'字段"

      - id: p1_q3
        text: "为什么会痛？现状是怎么凑合的？"
        why: "挖出根因。如果挖不到根因，解决方案会治标不治本。"
        followup_if_vague:
          - "是流程问题？工具问题？还是人问题？"
          - "这个问题最早什么时候出现？为什么一直没解决？"
        example_good: "FAQ 文档在 5 个系统里都有但分散，客服需要切 4 个 tab 才能找到答案"
        example_bad: "流程有问题（没说哪里）"
        kg_impact: "用户研究画像'痛点'列表 + 洞察'反例'字段"

    ready_signal: "PM 能清晰说出 1 个具体的人 + 1 个具体的痛 + 1 个具体的根因"
    if_not_ready: "继续追问这 3 题，不要推进到阶段 2"

  # ===========================================================================
  # 阶段 2：问题陈述（Problem Framing）
  # ===========================================================================
  - id: p2_problem_framing
    name: "问题陈述"
    order: 2
    purpose: "把'痛点'翻译成'可解决的问题'"
    question_count: 2
    trigger_phrase: "现在我们把'痛'变成'要解决的具体问题'"
    questions:
      - id: p2_q1
        text: "这个需求要解决的核心问题，用一句话是什么？"
        why: "PM 自己能一句话说清 = 真需求；说不清 = 还要回头打磨。"
        followup_if_vague:
          - "砍掉'还要...还要...'的部分，只留最核心一件"
          - "如果只能做 1 个功能，是哪个？"
        example_good: "让客服在 30 秒内找到统一的最权威 FAQ 答案"
        example_bad: "做一个智能客服系统（太泛）"
        kg_impact: "PRD 第 1 章'执行摘要'核心句"

      - id: p2_q2
        text: "如果不解决，最大代价是什么？谁最痛？时间窗口？"
        why: "量化代价 = 优先级排序依据。"
        followup_if_vague:
          - "金钱？时间？机会？合规风险？"
          - "谁来承担这个代价？"
        example_good: "每天客服浪费 4 小时找答案 × 5 人 × 200 元/小时 = 4000 元/天；客户等 2 分钟才有人接听"
        example_bad: "影响效率（没量化）"
        kg_impact: "指标'价值评估'的机会成本字段"

    ready_signal: "PM 能用 1 句话说清核心问题 + 量化代价"
    if_not_ready: "回到阶段 1 重新澄清"

  # ===========================================================================
  # 阶段 3：关键假设（Assumptions）
  # ===========================================================================
  - id: p3_assumptions
    name: "关键假设"
    order: 3
    purpose: "挖出'没明说但默认成立'的假设，避免产品上线后崩"
    question_count: 3
    trigger_phrase: "下面这几个'假设'，你确认默认成立吗？"
    questions:
      - id: p3_q1
        text: "做这个需求最关键的 1 个假设是什么？如果假设错了会怎样？"
        why: "假设错了 = 整个产品白做。"
        followup_if_vague:
          - "你怎么验证这个假设？"
          - "如果错了，能不能快速调整？"
        example_good: "假设：客服愿意主动更新 FAQ 库。错了的话：知识库陈旧，机器人答错"
        example_bad: "假设是用户会付费（没验证）"
        kg_impact: "合规'伦理审查' + 原型'技术风险'字段"

      - id: p3_q2
        text: "用户/客户/监管方面有什么外部依赖？"
        why: "依赖方掉链 = 产品掉链。"
        followup_if_vague:
          - "数据从哪来？接口谁提供？"
          - "需要审批/合规/采购流程吗？"
        example_good: "依赖：① 主数据源 公开 API ② 内部 CRM 知识库（运维负责）"
        example_bad: "没有外部依赖（多数情况不真）"
        kg_impact: "原型'技术依赖'字段 + 风险清单"

      - id: p3_q3
        text: "数据从哪来？谁提供？数据量级？更新频率？"
        why: "数据是 AI 类需求的命脉。"
        followup_if_vague:
          - "需要爬虫？手工？第三方 API？"
          - "数据陈旧怎么办？"
        example_good: "FAQ 库：运维每月初手工同步，~500 条"
        example_bad: "（PM 答不出）"
        kg_impact: "原型'数据源' + 降级链路"

    ready_signal: "PM 列出至少 3 个关键假设 + 知道怎么验证"
    if_not_ready: "回到阶段 1 重新挖根因"

  # ===========================================================================
  # 阶段 4：边界（Scope）
  # ===========================================================================
  - id: p4_scope
    name: "边界"
    order: 4
    purpose: "明确'MVP 做什么 / 不做什么'，避免范围蔓延"
    question_count: 2
    trigger_phrase: "接下来定边界——什么做、什么不做"
    questions:
      - id: p4_q1
        text: "MVP 必须有什么？（1 周后能给用户演示的最小集合）"
        why: "MVP 越小越能验证。"
        followup_if_vague:
          - "如果只能做 3 个功能，是哪 3 个？"
          - "用户能感知到价值的最小路径是什么？"
        example_good: "MVP：① 搜索框 ② 智能回答 ③ '未找到'兜底"
        example_bad: "全部功能都要（没边界 = 没 MVP）"
        kg_impact: "战略'FR P0 清单'字段"

      - id: p4_q2
        text: "什么不做？明确说出来的'不做'，比'做'更重要"
        why: "PM 主动声明不做 = 团队不再纠结这些。"
        followup_if_vague:
          - "V2 再说 / 永远不做 / 别人做？"
          - "如果竞争对手做，我们做不做？"
        example_good: "V1 不做：① 多语言 ② 语音输入 ③ 视频理解"
        example_bad: "（PM 答不出，事后范围蔓延）"
        kg_impact: "PRD Out-of-Scope 段"

    ready_signal: "PM 列出 MVP 3-5 个 + Out-of-Scope 3-5 个"
    if_not_ready: "回到阶段 2 重新对焦核心问题"

  # ===========================================================================
  # 阶段 5：成功指标（Metrics）
  # ===========================================================================
  - id: p5_metrics
    name: "成功指标"
    order: 5
    purpose: "怎么算做成了？怎么算做砸了？"
    question_count: 2
    trigger_phrase: "最后一个问题：怎么衡量成败？"
    questions:
      - id: p5_q1
        text: "怎么算'做成了'？北极星指标是什么？"
        why: "没指标的 = 没法验收。"
        followup_if_vague:
          - "如果只有 1 个数字看，是哪个？"
          - "这个数字 3 个月后应该涨到多少？"
        example_good: "客服首次解决率 ≥ 70%（5 分钟内关单）"
        example_bad: "用户满意（没量化）"
        kg_impact: "指标'北极星指标'字段"

      - id: p5_q2
        text: "怎么算'做砸了'？什么数字代表必须下架？"
        why: "止损线比成功线更重要。"
        followup_if_vague:
          - "如果连续 1 周某指标低于 X？"
          - "用户投诉量超过 Y？"
        example_good: "答错率 > 30% 必须立刻下架"
        example_bad: "用户投诉（没阈值）"
        kg_impact: "合规 BLOCK 决策 + 风险预案"

    ready_signal: "PM 给出 1 个北极星 + 1 个止损线"
    if_not_ready: "回到阶段 2 重新对焦"

# -----------------------------------------------------------------------------
# 阶段间流转规则
# -----------------------------------------------------------------------------
flow:
  on_phase_complete: |
    supervisor检查 ready_signal：
    - 满足 → 自动进入下一阶段
    - 不满足 → 输出"信息不足，请补充 X / Y / Z"，让 PM 继续在同一阶段回答
  on_all_phases_complete: |
    1. supervisor把所有回答整理成 01_socratic_clarifications.md
    2. state.json 置 phase=DRAFTING, clarification_pending=null
    3. git commit: "clarify-5phase: REQ-XXX"
  on_phase_timeout: "30 分钟无 PM 答复 → 自动跳过，标 clarification_skipped: 'timeout-5phase'"

# -----------------------------------------------------------------------------
# 与旧 5 维度的对照
# -----------------------------------------------------------------------------
legacy_mapping:
  background: "→ 阶段 2 (problem_framing.p2_q1)"
  core_problem: "→ 阶段 2 (problem_framing.p2_q1 + p2_q2)"
  scope: "→ 阶段 4 (scope.p4_q1 + p4_q2)"
  scenarios: "→ 阶段 1 (circumstance.p1_q1 + p1_q3)"
  users: "→ 阶段 1 (circumstance.p1_q1)"
  note: "v3.2 5 阶段覆盖 5 维度的所有内容，但顺序和深度不同：先情境再问题再假设"

# -----------------------------------------------------------------------------
# PM 跳过机制
# -----------------------------------------------------------------------------
skip_rules:
  single_phase: "PM 说 'phase 跳过 3' → 该阶段答案留空，标 skipped: [3]"
  all_skip: "PM 说 '跳过澄清' → 走 legacy 5 维度模式（fallback）"
  timeout: "30 分钟无响应 → 整组 timeout，跳到 DRAFTING 用 default 值"